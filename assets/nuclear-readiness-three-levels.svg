<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" role="img" aria-labelledby="title desc">
<title id="title">Three levels of nuclear supplier delivery readiness</title>
<desc id="desc">Level 1 verifies that requirements and controls exist; level 2 demonstrates that the system operates effectively; level 3 demonstrates capability for a defined scope, resources and interfaces. Change management, safety culture, oversight and records apply across all three levels.</desc>
<rect width="1200" height="570" fill="#f7f5f0"/>
<rect x="0" y="0" width="1200" height="12" fill="#142633"/>
<text x="48" y="58" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="17" fill="#aa531e" letter-spacing="2">THE NUCLEAR READINESS TEST</text>
<text x="48" y="106" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="36" fill="#142633">Three levels. One scope-specific decision.</text>
<text x="48" y="143" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#53616a">The evidence must support the work, not simply the existence of a management system.</text>
<rect x="45" y="185" width="350" height="236" rx="12" fill="#fff" stroke="#dadce1" stroke-width="2"/>
<rect x="45" y="185" width="350" height="10" rx="4" fill="#74618b"/>
<text x="69" y="238" font-family="Arial" font-weight="700" font-size="17" fill="#74618b" letter-spacing="1.5">LEVEL 01</text>
<text x="69" y="284" font-family="Arial" font-weight="700" font-size="29" fill="#142633">SYSTEM EXISTS</text>
<text x="69" y="329" font-family="Arial" font-size="18" fill="#43505b">Requirements become defined</text>
<text x="69" y="357" font-family="Arial" font-size="18" fill="#43505b">processes, roles and controls.</text>
<text x="69" y="393" font-family="Arial" font-weight="700" font-size="16" fill="#74618b">Evidence: approved baseline</text>
<rect x="425" y="185" width="350" height="236" rx="12" fill="#fff" stroke="#dadce1" stroke-width="2"/>
<rect x="425" y="185" width="350" height="10" rx="4" fill="#d27232"/>
<text x="449" y="238" font-family="Arial" font-weight="700" font-size="17" fill="#b75c20" letter-spacing="1.5">LEVEL 02</text>
<text x="449" y="284" font-family="Arial" font-weight="700" font-size="29" fill="#142633">SYSTEM WORKS</text>
<text x="449" y="329" font-family="Arial" font-size="18" fill="#43505b">People apply the controls</text>
<text x="449" y="357" font-family="Arial" font-size="18" fill="#43505b">consistently in sampled work.</text>
<text x="449" y="393" font-family="Arial" font-weight="700" font-size="16" fill="#b75c20">Evidence: observed performance</text>
<rect x="805" y="185" width="350" height="236" rx="12" fill="#fff" stroke="#dadce1" stroke-width="2"/>
<rect x="805" y="185" width="350" height="10" rx="4" fill="#1f7477"/>
<text x="829" y="238" font-family="Arial" font-weight="700" font-size="17" fill="#1f7477" letter-spacing="1.5">LEVEL 03</text>
<text x="829" y="278" font-family="Arial" font-weight="700" font-size="27" fill="#142633">SCOPE-SPECIFIC</text>
<text x="829" y="310" font-family="Arial" font-weight="700" font-size="27" fill="#142633">DELIVERY</text>
<text x="829" y="348" font-family="Arial" font-size="17" fill="#43505b">Work package + capacity +</text>
<text x="829" y="372" font-family="Arial" font-size="17" fill="#43505b">interfaces + acceptance proof.</text>
<text x="829" y="403" font-family="Arial" font-weight="700" font-size="15" fill="#1f7477">Evidence: representative execution</text>
<rect x="45" y="444" width="1110" height="73" rx="9" fill="#142633"/>
<text x="67" y="475" font-family="Arial" font-weight="700" font-size="17" fill="#f0c29b">CONTROLS THAT CUT ACROSS ALL LEVELS</text>
<text x="67" y="499" font-family="Arial" font-size="17" fill="#fff">Safety culture  |  Requirements &amp; interfaces  |  Change / NCR  |  Surveillance  |  Records</text>
<text x="47" y="545" font-family="Arial" font-size="15" fill="#5c6570">Illustrative management framework, not a certification or regulatory classification.</text>
<text x="1148" y="545" text-anchor="end" font-family="Arial" font-size="13" fill="#5c6570">Ievgen Petrenko  |  2026</text>
</svg>